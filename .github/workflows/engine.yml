# Builds and tests the engine and the Python package on Linux with GCC 16
# (the minimum for std::mdspan), on every push and pull request.
name: engine

on:
  push:
  pull_request:

jobs:
  linux-gcc16:
    runs-on: ubuntu-latest
    container:
      image: gcc:16
      options: --cap-add SYS_PTRACE  # LeakSanitizer needs ptrace in containers.
    env:
      UV_PYTHON: "3.14"  # The project's version; ray has no wheels for newer ones yet.
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: apt-get update && apt-get install -y --no-install-recommends cmake curl ca-certificates
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Report compiler errors as annotations
        run: echo "::add-matcher::.github/gcc-problem-matcher.json"
      - name: Configure (Release)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DHANABI_NATIVE_ARCH=OFF
      - name: Build (Release)
        run: cmake --build build -j
      - name: Engine tests
        run: ctest --test-dir build --output-on-failure
      - name: Configure and build (Debug, ASan + UBSan)
        run: |
          cmake -S . -B build-debug -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-debug -j
      - name: Engine tests under ASan + UBSan
        run: ctest --test-dir build-debug --output-on-failure
      - name: Install Python environment
        shell: bash
        run: |
          if ! uv sync 2>&1 | tee uv-sync.log; then
            echo "::error::uv sync failed: $(tail -c 3000 uv-sync.log | tr '\n' ' ')"
            exit 1
          fi
      - name: Ruff lint
        run: uv run ruff check --output-format=github .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Python tests
        shell: bash
        run: |
          if ! uv run pytest -m "not slow" -v 2>&1 | tee pytest.log; then
            echo "::error::pytest failed: $(tail -c 3000 pytest.log | tr '\n' ' ')"
            exit 1
          fi
